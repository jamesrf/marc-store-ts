name: Checks

# Reusable workflow: called by ci.yml on every push/PR and by release.yml
# before publishing, so the release runs exactly the same checks as CI.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage -- --run

      - run: npm run build

      - run: npm run examples

      - name: Pack tarball
        if: matrix.node-version == 26
        run: npm pack --cache .npm-cache

      - name: Upload tarball
        if: matrix.node-version == 26
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: marc-store-ts-*.tgz
          if-no-files-found: error
